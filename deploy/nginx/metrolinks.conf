# Metrolinks — nginx site beside Soma Smart (elearning).
# Install:
#   sudo cp deploy/nginx/metrolinks.conf /etc/nginx/sites-available/metrolinks
#   sudo ln -sf /etc/nginx/sites-available/metrolinks /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Does NOT edit the elearning site.
#
# Point DNS A records for these hosts at the SAME VPS IP as somasmartassesments.com.

upstream metrolinks_app {
    server unix:/run/metrolinks/metrolinks.sock fail_timeout=0;
}

# Optional: apex → www
server {
    listen 80;
    listen [::]:80;
    server_name metrolinkssolutionltd.co.ke;
    return 301 https://www.metrolinkssolutionltd.co.ke$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.metrolinkssolutionltd.co.ke tickets.metrolinkssolutionltd.co.ke;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.metrolinkssolutionltd.co.ke tickets.metrolinkssolutionltd.co.ke;

    # Certbot fills these in:
    # ssl_certificate /etc/letsencrypt/live/metrolinkssolutionltd.co.ke/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/metrolinkssolutionltd.co.ke/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /srv/metrolinks/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /srv/metrolinks/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://metrolinks_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
