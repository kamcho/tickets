# Hostinger VPS — nginx site for Metrolinks
# Install:
#   sudo cp deploy/nginx/metrolinks.conf /etc/nginx/sites-available/metrolinks
#   sudo ln -sf /etc/nginx/sites-available/metrolinks /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then issue certs:
#   sudo certbot --nginx -d metrolinkssolutionltd.co.ke -d www.metrolinkssolutionltd.co.ke -d tickets.metrolinkssolutionltd.co.ke
#
# Adjust APP_ROOT if your clone path differs.

upstream metrolinks_gunicorn {
    server 127.0.0.1:8000 fail_timeout=0;
}

# Redirect apex → www (optional; remove if you prefer apex as canonical)
server {
    listen 80;
    listen [::]:80;
    server_name metrolinkssolutionltd.co.ke;
    return 301 https://www.metrolinkssolutionltd.co.ke$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name www.metrolinkssolutionltd.co.ke tickets.metrolinkssolutionltd.co.ke;

    # Certbot will replace this block with HTTPS; keep ACME path available
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.metrolinkssolutionltd.co.ke tickets.metrolinkssolutionltd.co.ke;

    # Managed by Certbot — placeholders until you run certbot
    # ssl_certificate /etc/letsencrypt/live/metrolinkssolutionltd.co.ke/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/metrolinkssolutionltd.co.ke/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # WhiteNoise serves /static/ from Django; optional direct alias for cache headers:
    # location /static/ {
    #     alias /var/www/metrolinks/staticfiles/;
    #     expires 30d;
    #     add_header Cache-Control "public, immutable";
    # }

    location /media/ {
        alias /var/www/metrolinks/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://metrolinks_gunicorn;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
