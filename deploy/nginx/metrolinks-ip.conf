# Temporary IP access — Metrolinks on raw VPS IP (Soma Smart keeps domain names).
# http://185.170.196.219/login/  (:80)
# http://185.170.196.219:8080/   (legacy alternate port)
#
#   sudo cp deploy/nginx/metrolinks-ip.conf /etc/nginx/sites-available/metrolinks-ip
#   sudo ln -sf /etc/nginx/sites-available/metrolinks-ip /etc/nginx/sites-enabled/
#   sudo ufw allow 8080/tcp
#   sudo nginx -t && sudo systemctl reload nginx

upstream metrolinks_app_ip {
    server unix:/run/metrolinks/metrolinks.sock fail_timeout=0;
}

# Port 80 when browser uses the IP (not somasmartassesments.com)
server {
    listen 80;
    listen [::]:80;
    server_name 185.170.196.219;

    client_max_body_size 20M;

    location /static/ {
        alias /srv/metrolinks/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /srv/metrolinks/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://metrolinks_app_ip;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}

server {
    listen 8080;
    listen [::]:8080;
    server_name 185.170.196.219 _;

    client_max_body_size 20M;

    location /static/ {
        alias /srv/metrolinks/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /srv/metrolinks/media/;
        access_log off;
        expires 7d;
    }

    location / {
        proxy_pass http://metrolinks_app_ip;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
